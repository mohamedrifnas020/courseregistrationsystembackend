services:

  mysql:
    image: mysql:8.0

    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: course_reg_sys

    ports:
      - "3307:3306"
      - restart: always

  backend:
    build: .

    container_name: backend

    ports:
      - "8080:8080"

    depends_on:
      - mysql
#      - restart: always